<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>Login</h2>
        <div class="form-group">
            <button id="emailLoginBtn">Login with Email</button>
            <button id="phoneLoginBtn">Login with Phone</button>
        </div>

        <!-- Email Login Form -->
        <div id="emailForm" class="form hidden">
            <input type="email" id="email" placeholder="Enter your email" required>
            <input type="password" id="password" placeholder="Enter your password" required>
            <button onclick="loginWithEmail()">Login with Email</button>
        </div>

        <!-- Phone Login Form -->
        <div id="phoneForm" class="form hidden">
            <input type="text" id="phoneNumber" placeholder="Enter your phone number" required>
            <button onclick="sendOTP()">Send OTP</button>
            <input type="text" id="otp" placeholder="Enter OTP" class="hidden">
            <button onclick="verifyOTP()" class="hidden">Verify OTP</button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth.js"></script>
    <script src="main.js"></script>
</body>
</html>
